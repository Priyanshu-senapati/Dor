name: Dor reminder check

# Vercel's free plan only runs cron once a day, so GitHub calls the check every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run reminders, missed-dose alerts and escalation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DOR_URL: ${{ secrets.DOR_URL }}
        run: curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$DOR_URL/api/cron"
